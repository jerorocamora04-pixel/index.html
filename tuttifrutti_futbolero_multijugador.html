<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tuttifrutti Futbolero</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><style>
body{margin:0;background:#07111f;color:#f5f8fc;font-family:system-ui,Arial}.wrap{max-width:1200px;margin:auto;padding:24px}.card{background:#0d1b2d;border:1px solid #203954;border-radius:18px;padding:22px;margin-bottom:18px}h1{font-size:clamp(38px,7vw,76px);margin:15px 0}h1 span{color:#20d47b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:flex;gap:8px}.field input{flex:1;background:#081522;color:#fff;border:1px solid #28445e;padding:13px;border-radius:10px}.btn{border:0;border-radius:10px;padding:13px 17px;font-weight:800;cursor:pointer}.green{background:#20d47b;color:#03150c}.blue{background:#19324d;color:#fff}.red{background:#ff526b;color:#fff}.yellow{background:#ffd84d;color:#171100}.hidden{display:none}.room{font-size:34px;color:#20d47b;font-weight:900;letter-spacing:5px}.players{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#162c45;border:1px solid #294967;padding:8px 12px;border-radius:999px}.letter{text-align:center;font-size:100px;font-weight:1000;color:#20d47b}.timer{text-align:center;font-size:28px;font-weight:900}.actions{text-align:center;margin:18px 0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.table{overflow:auto}.answers{width:100%;border-collapse:collapse;min-width:1050px}.answers th,.answers td{padding:9px;border-bottom:1px solid #203954}.answers th{background:#0a1726;text-align:left}.answers input{width:100%;box-sizing:border-box;background:#081522;color:#fff;border:1px solid #294967;padding:10px;border-radius:8px}.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.score{background:#081522;padding:14px;border:1px solid #203954;border-radius:12px}.note{color:#9eb0c4;font-size:13px;line-height:1.5}.result{border:1px solid #203954;padding:14px;border-radius:12px;margin:10px 0}.mini{display:flex;gap:5px;margin:7px 0;flex-wrap:wrap}.mini button{padding:6px 8px;border:0;border-radius:7px;background:#19324d;color:#fff;cursor:pointer}.mini .ok{background:#145c3b}.mini .bad{background:#63303b}.link{word-break:break-all;background:#081522;padding:10px;border-radius:9px;color:#bcd0e4}@media(max-width:750px){.grid{grid-template-columns:1fr}.field{flex-direction:column}.wrap{padding:12px}}
</style></head><body><div class="wrap">
<div style="display:flex;justify-content:space-between;align-items:center"><b>⚽ TUTTIFRUTTI <span style="color:#20d47b">FUTBOLERO</span></b><small id="status">Desconectado</small></div>
<section id="home" class="card" style="text-align:center;padding:45px 20px"><h1>TUTTIFRUTTI <span>FUTBOLERO</span></h1><p class="note">Una letra. Nueve categorías. Fútbol a toda velocidad.</p><div class="grid" style="text-align:left;max-width:850px;margin:30px auto"><div class="card"><h2>Crear sala</h2><div class="field"><input id="hostName" placeholder="Tu nombre"><button class="btn green" onclick="createRoom()">Crear</button></div></div><div class="card"><h2>Unirme</h2><div class="field"><input id="joinName" placeholder="Tu nombre"><input id="roomInput" placeholder="CÓDIGO"><button class="btn green" onclick="joinRoom()">Entrar</button></div></div></div></section>
<section id="lobby" class="card hidden"><h2>Sala <span id="roomCode" class="room"></span></h2><p class="note">Comparte esta invitación:</p><div id="invite" class="link"></div><button class="btn blue" onclick="copyInvite()">Copiar invitación</button><h3>Jugadores</h3><div id="players" class="players"></div><div class="actions"><button id="start" class="btn green" onclick="startRound()">▶ Empezar ronda</button><button class="btn red" onclick="leave()">Salir</button></div><p class="note">Necesitáis al menos 2 jugadores.</p></section>
<section id="game" class="hidden"><div class="card"><div style="display:flex;justify-content:space-between"><b id="round">Ronda 1</b><b id="timer">01:30</b></div><div class="note" style="text-align:center">Completa las categorías con la letra:</div><div id="letter" class="letter">A</div><div class="actions"><button class="btn yellow" onclick="basta()">🛑 ¡BASTA!</button><button class="btn blue" onclick="document.getElementById('scoreBox').classList.toggle('hidden')">🏆 Marcador</button></div><div class="table"><table class="answers"><thead><tr id="heads"></tr></thead><tbody><tr id="inputs"></tr></tbody></table></div></div><div id="scoreBox" class="card hidden"><h2>🏆 Marcador</h2><div id="scores" class="scores"></div></div><div id="review" class="card hidden"></div></section></div>
<script>
const CATS=["Jugador actual","Equipo","Selección","Entrenador","Jugó en Real Madrid o Barça","Leyenda","Ganador Balón de Oro / Bota de Oro / Premio Puskás"],LETTERS=[..."ABCDEFGHILMNOPRSTUVYZ"];
let peer,host=false,room="",name="",conns=[],players={},scores={},round=0,state={phase:"lobby",letter:"",endsAt:0,answers:{}};let timer;
const $=x=>document.getElementById(x), esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function status(x){$("status").textContent=x} function id(){return "TF"+Math.random().toString(36).slice(2,8).toUpperCase()}
function peerStart(done){peer=new Peer({debug:0});peer.on("open",x=>{status("Conectado");done(x)});peer.on("connection",c=>{c.on("open",()=>setup(c))});peer.on("error",e=>{status("Error de conexión");alert("Error de conexión: "+e.type)})}
function setup(c){if(!conns.includes(c))conns.push(c);c.on("data",m=>msg(c,m));c.on("close",()=>{conns=conns.filter(x=>x!==c);renderPlayers()})}
function send(m){conns.forEach(c=>{if(c.open)c.send(m)})}
function createRoom(){name=($("hostName").value||"Anfitrión").trim();host=true;room=id();peerStart(pid=>{players[pid]={id:pid,name,host:true};scores[pid]=0;showLobby()})}
function joinRoom(){name=($("joinName").value||"Jugador").trim();room=$("roomInput").value.trim().toUpperCase();if(!room)return alert("Pon el código");host=false;peerStart(pid=>{let c=peer.connect(room,{reliable:true});c.on("open",()=>{setup(c);c.send({t:"join",id:pid,name})})})}
function showLobby(){$("home").classList.add("hidden");$("lobby").classList.remove("hidden");$("game").classList.add("hidden");$("roomCode").textContent=room;$("invite").textContent=location.href.split("?")[0]+"?room="+room;renderPlayers()}
function renderPlayers(){$("players").innerHTML=Object.values(players).map(p=>`<span class="pill">${p.host?"👑 ":""}${esc(p.name)}</span>`).join("");$("start").disabled=!host||Object.keys(players).length<2}
function startRound(){if(!host)return;round++;let L=LETTERS[Math.floor(Math.random()*LETTERS.length)];state={phase:"playing",letter:L,endsAt:Date.now()+90000,answers:{}};Object.keys(players).forEach(x=>state.answers[x]=Array(CATS.length).fill(""));broadcast();renderGame();clock()}
function broadcast(){send({t:"state",players,scores,round,state})}
function msg(c,m){if(m.t==="join"&&host){players[m.id]={id:m.id,name:m.name,host:false};scores[m.id]=0;c.send({t:"state",players,scores,round,state});send({t:"state",players,scores,round,state});renderPlayers()}else if(m.t==="state"){players=m.players;scores=m.scores;round=m.round;state=m.state;if(state.phase==="lobby")showLobby();else if(state.phase==="playing"){renderGame();clock()}else review()}else if(m.t==="answers"&&host){state.answers[m.id]=m.a;broadcast()}else if(m.t==="basta"&&host){state.phase="review";state.endsAt=Date.now();broadcast();review()}else if(m.t==="score"&&host){scores[m.id]=(scores[m.id]||0)+m.p;send({t:"scores",scores});renderScores()}else if(m.t==="scores"){scores=m.scores;renderScores()}}
function renderGame(){$("lobby").classList.add("hidden");$("game").classList.remove("hidden");$("review").classList.add("hidden");$("round").textContent="Ronda "+round;$("letter").textContent=state.letter;$("heads").innerHTML="<th>Categoría</th>"+CATS.map(x=>"<th>"+esc(x)+"</th>").join("");let a=state.answers[peer.id]||Array(CATS.length).fill("");$("inputs").innerHTML="<td><b>Tus respuestas</b></td>"+CATS.map((x,i)=>`<td><input value="${esc(a[i])}" oninput="ans(${i},this.value)"></td>`).join("");renderScores()}
function ans(i,v){if(!state.answers[peer.id])state.answers[peer.id]=Array(CATS.length).fill("");state.answers[peer.id][i]=v;clearTimeout(window.st);window.st=setTimeout(()=>{if(host)broadcast();else conns[0]?.send({t:"answers",id:peer.id,a:state.answers[peer.id]})},150)}
function clock(){clearInterval(timer);function f(){let s=Math.max(0,Math.ceil((state.endsAt-Date.now())/1000));$("timer").textContent="00:"+String(s).padStart(2,"0");if(s<=0){clearInterval(timer);if(host&&state.phase==="playing"){state.phase="review";broadcast();review()}}}f();timer=setInterval(f,250)}
function basta(){if(state.phase!=="playing")return;if(host){state.phase="review";broadcast();review()}else conns[0]?.send({t:"basta"})}
function review(){clearInterval(timer);$("review").classList.remove("hidden");let h="<h2>📝 Revisión</h2><p class='note'>El anfitrión valida cada respuesta. 10 = válida y única · 5 = válida repetida · 0 = no válida.</p>";if(host)Object.values(players).forEach(p=>{h+=`<div class="result"><b>${esc(p.name)}</b>`;CATS.forEach((cat,i)=>{let a=(state.answers[p.id]||[])[i]||"—";h+=`<div>${esc(cat)}: <strong>${esc(a)}</strong><div class="mini"><button class="ok" onclick="score('${p.id}',10)">+10</button><button onclick="score('${p.id}',5)">+5</button><button class="bad" onclick="score('${p.id}',0)">0</button></div></div>`});h+="</div>"});else h+="<p class='note'>Esperando al anfitrión…</p>";h+=host?`<div class="actions"><button class="btn green" onclick="startRound()">▶ Nueva ronda</button></div>`:"";$("review").innerHTML=h;renderScores()}
function score(pid,p){scores[pid]=(scores[pid]||0)+p;send({t:"scores",scores});renderScores()}
function renderScores(){$("scores").innerHTML=Object.values(players).sort((a,b)=>(scores[b.id]||0)-(scores[a.id]||0)).map(p=>`<div class="score">${esc(p.name)}<br><strong style="font-size:28px">${scores[p.id]||0}</strong> pts</div>`).join("")}
function copyInvite(){navigator.clipboard?.writeText($("invite").textContent);alert("Invitación copiada")}
function leave(){location.href=location.pathname}
let q=new URLSearchParams(location.search);if(q.get("room"))$("roomInput").value=q.get("room");
</script></body></html>
